<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
        Dashboard
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&amp;display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-family: 'Quicksand', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8FAFF] min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-56 flex flex-col bg-gradient-to-b from-[#667eea] to-[#764ba2]    text-white">
        <div class="px-5 py-6 flex flex-col gap-1">
            <div class="flex items-center gap-2">
                <i class="fas fa-graduation-cap text-white text-xl">
                </i>
                <h1 class="font-semibold text-lg">
                    Khoa CNTT
                </h1>
            </div>
            <p class="text-xs font-normal opacity-70">
                Hệ thống quản lý phúc khảo
            </p>
        </div>
        <nav class="flex flex-col gap-1 px-3">
            <a class="flex items-center gap-3 px-4 py-2 rounded-md text-white text-sm font-medium opacity-80 hover:opacity-100 transition"
                href="Khoa.html">
                <i class="fas fa-chart-bar text-gray-200"></i>
                Trang chủ
            </a>
            <a class="flex items-center gap-3 px-4 py-2 rounded-md text-white bg-[#4B54D2] text-sm font-medium "
                href="">
                <i class="fas fa-clipboard text-gray-200"></i>
                Chuyển cho GV
            </a>
            <a class="flex items-center gap-3 px-4 py-2 rounded-md text-white text-sm font-medium opacity-80 hover:opacity-100 transition"
                href="SummaryResult.html">
                <i class="fas fa-tasks text-gray-200"></i>
                Tổng hợp kết quả
            </a>
            <a class="flex items-center gap-3 px-4 py-2 rounded-md text-white text-sm font-medium opacity-80 hover:opacity-100 transition"
                href="sendPKT.html">
                <i class="fas fa-users text-gray-200"></i>
                Gửi PKT
            </a>
            <a class="flex items-center gap-3 px-4 py-2 rounded-md text-white text-sm font-medium opacity-80 hover:opacity-100 transition"
                href="DangNhap.html">
                <i class="fas fa-sign-out-alt text-gray-200"></i>
                Đăng xuất
            </a>
        </nav>
    </aside>
    <!-- Main Content -->
       <main class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="flex justify-between items-center px-6 py-4 bg-white border-b border-gray-200">
            <h2 class="text-black-100 font-Quicksand font-bold text-3xl">
                Chuyển phúc khảo cho giảng viên
            </h2>
            <div
                class="flex items-center gap-2 bg-[#F3F4F6] rounded-md px-3 py-1 text-xs font-medium text-gray-700 select-none">
                <i class="fas fa-user-circle text-black text-xl"></i>
                GV. Nguyễn Văn A
            </div>
        </header>

          <!-- Tab Content: Chuyển cho GV -->
            
                <div class="bg-white rounded-lg shadow-sm">
                    
                    <div class="p-6">
                        <!-- Form chuyển GV -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Chọn Giảng viên</label>
                                    <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                                        <option>TS. Trần Văn B - Giảng viên bộ môn</option>
                                        <option>PGS.TS. Lê Thị C - Phó trưởng bộ môn</option>
                                        <option>ThS. Hoàng Văn D - Giảng viên</option>
                                    </select>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2 ">Hạn phúc khảo</label>
                                    <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Ghi chú</label>
                                    <textarea rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ghi chú thêm..."></textarea>
                                </div>
                            </div>
                            
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <h4 class="font-medium text-gray-900 mb-4">YCPK được chọn</h4>
                                <div class="space-y-2">
                                    <div class="flex items-center space-x-2">
                                        <input type="checkbox" class="text-blue-600">
                                        <span class="text-sm">INT2204 - Lập trình hướng đối tượng</span>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <input type="checkbox" class="text-blue-600">
                                        <span class="text-sm">INT3306 - Phát triển ứng dụng Web</span>
                                    </div>
                                </div>
                                
                                <button class="w-full mt-4 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
                                    Chuyển cho Giảng viên
                                </button>
                            </div>
                        </div>
                    </div>
                
            </div>
       </main>
</body>
</html>
